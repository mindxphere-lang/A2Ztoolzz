<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EXAR — The Ultimate Streaming Experience</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #e11d48; --bg: #030303; }
        body { background-color: var(--bg); color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; }

        /* Netflix Style Header */
        .nf-header { background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%); }
        .logo-text { font-size: 1.8rem; font-weight: 900; color: var(--primary); letter-spacing: -1px; font-style: italic; }

        /* Horizontal Movie Row */
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .movie-card { transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .movie-card:hover { transform: scale(1.1); z-index: 50; }
        .movie-card img { border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.1); }

        /* net20.cc Style Bottom Sheet */
        .bottom-sheet { position: fixed; inset: 0; z-index: 9999; display: none; align-items: flex-end; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        .sheet-content { width: 100%; background: #121212; border-radius: 2rem 2rem 0 0; padding: 40px; border-top: 1px solid rgba(255,255,255,0.1); animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Player Modal */
        .player-modal { position: fixed; inset: 0; z-index: 10000; background: #000; display: none; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; }

        .server-pill { background: rgba(255,255,255,0.05); padding: 8px 18px; border-radius: 4px; font-size: 11px; font-weight: 900; text-transform: uppercase; transition: 0.3s; }
        .server-pill.active { background: white; color: black; }
    </style>
</head>
<body class="pb-20">

    <!-- Netflix Style Navbar -->
    <nav class="fixed top-0 w-full z-[100] nf-header p-6 flex justify-between items-center">
        <div class="flex items-center gap-8">
            <h1 class="logo-text">EXAR</h1>
            <div class="hidden md:flex gap-6 text-[11px] font-bold uppercase tracking-widest opacity-60">
                <a href="#" class="hover:opacity-100">Home</a>
                <a href="#" class="hover:opacity-100">Movies</a>
                <a href="#" class="hover:opacity-100">Series</a>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <i class="fa-solid fa-search opacity-40"></i>
            <div class="w-8 h-8 rounded bg-rose-600 flex items-center justify-center text-xs font-bold">M</div>
        </div>
    </nav>

    <!-- Hero Section (Billboard) -->
    <section class="relative h-[80vh] w-full overflow-hidden flex items-center px-12">
        <div id="hero-bg" class="absolute inset-0 bg-cover bg-center opacity-40 scale-105" style="background-image: url('https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=2070');"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#030303] via-transparent to-transparent"></div>
        
        <div class="relative z-10 max-w-2xl space-y-6">
            <h2 id="hero-title" class="text-6xl md:text-8xl font-black uppercase italic tracking-tighter leading-none">PREMIUM<br>CINEMA</h2>
            <div class="flex gap-4">
                <button class="bg-white text-black px-10 py-4 rounded font-black uppercase text-xs flex items-center gap-2"><i class="fa-solid fa-play"></i> Play Now</button>
                <button class="bg-white/20 text-white px-10 py-4 rounded font-black uppercase text-xs backdrop-blur-md border border-white/10">More Info</button>
            </div>
        </div>
    </section>

    <!-- Library Grid -->
    <main class="px-12 -mt-20 relative z-20 space-y-12">
        <h3 class="text-xl font-bold uppercase tracking-tight border-l-4 border-rose-600 pl-4">Trending Now</h3>
        <div id="movie-grid" class="movie-grid">
            <!-- Dynamic Content -->
        </div>
    </main>

    <!-- SELECTOR SHEET (net20 style) -->
    <div id="selector-sheet" class="bottom-sheet" onclick="if(event.target==this) this.style.display='none'">
        <div class="sheet-content max-w-2xl mx-auto">
            <div class="w-12 h-1 bg-white/10 rounded-full mx-auto mb-10"></div>
            <h3 id="sel-title" class="text-3xl font-black uppercase italic mb-8">Movie Title</h3>
            
            <div class="grid gap-4">
                <button onclick="playMovie('dual')" class="w-full bg-white/5 p-6 rounded-2xl flex items-center gap-6 border border-white/5 active:scale-95 transition">
                    <div class="w-14 h-14 bg-rose-600 rounded-2xl flex items-center justify-center text-2xl shadow-xl"><i class="fa-solid fa-play"></i></div>
                    <div class="text-left"><p class="text-lg font-bold uppercase">Multi-Audio Node</p><p class="text-[10px] opacity-40 uppercase">Supports Hindi / English / Multi-Sub</p></div>
                </button>
                
                <button onclick="playMovie('vlc')" class="w-full bg-[#f97316] p-6 rounded-2xl flex items-center gap-6 active:scale-95 transition shadow-2xl">
                    <div class="w-14 h-14 bg-black/20 rounded-2xl flex items-center justify-center text-2xl"><i class="fa-solid fa-orange-cone"></i></div>
                    <div class="text-left"><p class="text-lg font-bold uppercase text-white">VLC External Player</p><p class="text-[10px] text-white/60 uppercase">Direct Stream • Zero Buffering</p></div>
                </button>
            </div>
        </div>
    </div>

    <!-- FULLSCREEN PLAYER MODAL -->
    <div id="player-modal" class="player-modal">
        <div class="p-4 flex justify-between items-center bg-zinc-950 border-b border-white/5 z-50">
            <button onclick="closePlayer()" class="text-[10px] font-black uppercase text-zinc-500 hover:text-white transition tracking-widest"><i class="fa-solid fa-xmark mr-1"></i> Exit</button>
            <div class="flex gap-2" id="server-list"></div>
            <p class="text-[9px] font-bold opacity-30 uppercase tracking-[0.2em]">Neural Engine v4.0</p>
        </div>
        <div class="flex-1 relative flex items-center justify-center overflow-hidden">
            <!-- Analyzing Loader like net20.cc -->
            <div id="p-loader" class="absolute inset-0 flex flex-col items-center justify-center gap-6 bg-black z-20">
                <div class="w-16 h-16 border-4 border-rose-600/20 border-t-rose-600 rounded-full animate-spin"></div>
                <p class="text-[10px] font-black uppercase tracking-[0.5em] text-rose-500 animate-pulse">Analyzing Audio Streams...</p>
            </div>
            <iframe id="main-iframe" allowfullscreen src="" referrerpolicy="no-referrer"></iframe>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        const config = { apiKey: "AIzaSyDI7v-5DoTUWZBhajcpZk6ed9rH2GcAqLw", databaseURL: "https://a2ztools-6ea22-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config); const db = firebase.database();
        
        let activeImdb = "", activeTitle = "", workerUrl = "";
        db.ref('settings/workerUrl').on('value', s => workerUrl = s.val());

        const sources = [
            { name: "Node 1 (Dual Audio)", url: (id) => `https://vidsrc.cc/v2/embed/movie/${id}?autoPlay=1` },
            { name: "Node 2 (Hindi Dub)", url: (id) => `https://vidsrc.icu/embed/movie/${id}` }
        ];

        db.ref('movies').on('value', s => {
            const grid = document.getElementById('movie-grid'); grid.innerHTML = '';
            let count = 0;
            s.forEach(child => {
                const m = child.val();
                if(count === 0) { // Hero Update
                    document.getElementById('hero-bg').style.backgroundImage = `url('${m.poster}')`;
                    document.getElementById('hero-title').innerHTML = m.title.split(' ').join('<br>');
                }
                grid.innerHTML += `<div class="movie-card" onclick="openSelector('${m.imdbId}', '${m.title}')">
                    <img src="${m.poster}" class="w-full">
                </div>`;
                count++;
            });
        });

        function openSelector(id, title) {
            activeImdb = id; activeTitle = title;
            document.getElementById('sel-title').innerText = title;
            document.getElementById('selector-sheet').style.display = 'flex';
        }

        function playMovie(mode) {
            document.getElementById('selector-sheet').style.display = 'none';
            if(mode === 'vlc') {
                const stream = `${workerUrl}?id=${activeImdb}`;
                window.location.href = `intent://${stream.replace('https://','')}#Intent;package=org.videolan.vlc;type=video/*;scheme=https;S.title=${activeTitle};end`;
            } else {
                const modal = document.getElementById('player-modal');
                const list = document.getElementById('server-list');
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
                list.innerHTML = sources.map((s, i) => `<button onclick="switchSource(${i})" class="server-pill s-btn-${i} ${i===0?'active':''}">${s.name}</button>`).join('');
                switchSource(0);
            }
        }

        function switchSource(idx) {
            document.querySelectorAll('.server-pill').forEach(b => b.classList.remove('active'));
            document.querySelectorAll(`.s-btn-${idx}`).forEach(b => b.classList.add('active'));
            const iframe = document.getElementById('main-iframe');
            document.getElementById('p-loader').style.display = 'flex';
            iframe.src = sources[idx].url(activeImdb);
            iframe.onload = () => { setTimeout(() => { document.getElementById('p-loader').style.display = 'none'; }, 2500); };
        }

        function closePlayer() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('main-iframe').src = '';
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
