<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EXAR CINEMA — Ultimate Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        .movie-card { transition: 0.4s ease; cursor: pointer; }
        .movie-card:hover { transform: translateY(-5px) scale(1.03); }
        .movie-card img { border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.05); }
        
        /* Modal Fix */
        .player-modal { position: fixed; inset: 0; z-index: 9999; background: black; display: none; flex-direction: column; }
        
        /* Buttons Styling */
        .server-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px 18px; border-radius: 10px; font-size: 10px; font-weight: 800; text-transform: uppercase; white-space: nowrap; transition: 0.3s; color: rgba(255,255,255,0.6); }
        .server-btn.active { background: #e11d48; border-color: #ff4d6d; color: white; box-shadow: 0 0 15px rgba(225, 29, 72, 0.4); }
        
        .vlc-btn { background: linear-gradient(135deg, #f97316, #ea580c); box-shadow: 0 0 20px rgba(249, 115, 22, 0.3); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .iframe-container { position: relative; width: 100%; height: 100%; background: #000; flex: 1; }
        iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; z-index: 10; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header -->
    <nav class="flex justify-between items-center mb-10 max-w-7xl mx-auto">
        <a href="index.html" class="w-10 h-10 flex items-center justify-center bg-white/5 rounded-xl border border-white/10 active:scale-90 transition"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="text-xl font-black uppercase italic tracking-tighter text-rose-600">EXAR CINEMA</h1>
        <div class="w-2 h-2 rounded-full bg-rose-600 animate-ping"></div>
    </nav>

    <!-- Grid -->
    <div id="movie-grid" class="max-w-7xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>

    <!-- PLAYER INTERFACE -->
    <div id="player-modal" class="player-modal">
        
        <!-- TOP BAR (Exit & VLC) -->
        <div class="p-4 flex justify-between items-center bg-zinc-950 border-b border-white/5">
            <button onclick="closePlayer()" class="bg-white/5 px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest text-zinc-400"><i class="fa-solid fa-xmark mr-1"></i> Exit</button>
            
            <button onclick="launchVLCFromEmbed()" class="vlc-btn px-6 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest text-white">
                <i class="fa-solid fa-orange-cone mr-1"></i> VLC Player
            </button>
        </div>

        <!-- SERVER BAR (Scrollable) -->
        <div class="bg-zinc-900/50 p-3 border-b border-white/5 flex gap-2 overflow-x-auto no-scrollbar" id="server-list">
            <!-- Server Buttons will load here -->
        </div>

        <!-- VIDEO AREA -->
        <div class="iframe-container">
            <div id="p-loader" class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-black z-20">
                <div class="w-10 h-10 border-2 border-rose-600/20 border-t-rose-600 rounded-full animate-spin"></div>
                <p class="text-[9px] font-black uppercase tracking-[0.2em] text-rose-500 animate-pulse">Neural Node Connecting...</p>
            </div>
            <iframe id="main-iframe" allowfullscreen src="" referrerpolicy="no-referrer"></iframe>
        </div>

        <!-- MOVIE TITLE BAR -->
        <div class="p-3 bg-black text-center border-t border-white/5">
            <p id="movie-status" class="text-[9px] font-black uppercase tracking-widest text-zinc-500 truncate"></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script>
        const config = { apiKey: "AIzaSyDI7v-5DoTUWZBhajcpZk6ed9rH2GcAqLw", databaseURL: "https://a2ztools-6ea22-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config); const db = firebase.database();
        
        let currentImdbId = "", currentTitle = "";

        const sources = [
            { name: "Server 1 (Multi-Audio)", url: (id) => `https://vidsrc.cc/v2/embed/movie/${id}?autoPlay=1` },
            { name: "Server 2 (Hindi Dub)", url: (id) => `https://vidsrc.icu/embed/movie/${id}` },
            { name: "Server 3 (Direct Pro)", url: (id) => `https://vidlink.pro/movie/${id}?primaryColor=e11d48` },
            { name: "Server 4 (Backup)", url: (id) => `https://multiembed.mov/?video_id=${id}&tmdb=0` }
        ];

        db.ref('movies').on('value', s => {
            const grid = document.getElementById('movie-grid'); grid.innerHTML = '';
            s.forEach(child => {
                const m = child.val();
                grid.innerHTML += `<div class="movie-card group" onclick="openPlayer('${m.imdbId}', '${m.title}')">
                    <img src="${m.poster}" class="aspect-[2/3] object-cover mb-3 shadow-lg">
                    <h4 class="text-[10px] font-bold uppercase truncate px-1 opacity-60">${m.title}</h4>
                </div>`;
            });
        });

        function openPlayer(imdbId, title) {
            currentImdbId = imdbId; currentTitle = title;
            const modal = document.getElementById('player-modal');
            const list = document.getElementById('server-list');
            
            // Inject Servers
            list.innerHTML = sources.map((src, i) => 
                `<button onclick="switchServer(${i})" class="server-btn s-btn-${i} ${i===0?'active':''}">${src.name}</button>`
            ).join('');

            document.getElementById('movie-status').innerText = `NODE: ${title}`;
            switchServer(0); 
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function switchServer(index) {
            document.querySelectorAll('.server-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll(`.s-btn-${index}`).forEach(btn => btn.classList.add('active'));
            
            const iframe = document.getElementById('main-iframe');
            const loader = document.getElementById('p-loader');
            
            loader.style.display = 'flex';
            iframe.src = sources[index].url(currentImdbId);
            
            iframe.onload = () => {
                setTimeout(() => { loader.style.display = 'none'; }, 2000);
            };
        }

        function launchVLCFromEmbed() {
            const currentUrl = document.getElementById('main-iframe').src;
            const userAgent = navigator.userAgent;

            if (/android/i.test(userAgent)) {
                window.location.href = `intent://${currentUrl.replace('https://','')}#Intent;package=org.videolan.vlc;type=video/*;scheme=https;S.title=${currentTitle};end`;
            } else if (/iPad|iPhone|iPod/.test(userAgent)) {
                window.location.href = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(currentUrl)}`;
            } else {
                window.location.href = `vlc://${currentUrl}`;
            }
        }

        function closePlayer() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('main-iframe').src = '';
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
