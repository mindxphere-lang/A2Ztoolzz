<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CINEMA — Pure Elite Node</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <!-- Premium Player Assets -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root { --primary: #8b5cf6; --bg: #030303; --rose: #e11d48; }
        body { background-color: var(--bg); color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        
        ::-webkit-scrollbar { display: none; }

        /* Cinematic UI */
        .glass { background: rgba(15, 15, 15, 0.7); backdrop-filter: blur(25px) saturate(160%); border: 1px solid rgba(255,255,255,0.08); }
        .hero-vignette { background: linear-gradient(0deg, #030303 0%, transparent 100%); }

        /* Modern Movie Card */
        .movie-card { transition: 0.6s cubic-bezier(0.2, 1, 0.2, 1); cursor: pointer; }
        .movie-card:hover { transform: scale(1.06) translateY(-10px); }
        .movie-card img { border-radius: 1.2rem; border: 1px solid rgba(255,255,255,0.05); }
        .movie-card:hover img { border-color: var(--primary); box-shadow: 0 20px 40px rgba(139, 92, 246, 0.3); }

        /* Selection Sheet */
        .bottom-sheet { position: fixed; inset: 0; z-index: 5000; display: none; align-items: flex-end; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); }
        .sheet-content { width: 100%; background: #0a0a0a; border-radius: 3rem 3rem 0 0; padding: 35px; border-top: 1px solid rgba(139, 92, 246, 0.2); animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .node-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); padding: 20px; border-radius: 1.8rem; display: flex; align-items: center; gap: 15px; width: 100%; transition: 0.3s; }
        .node-btn:active { background: var(--primary); transform: scale(0.95); }

        /* Fullscreen Player Terminal */
        .player-modal { position: fixed; inset: 0; z-index: 9999; background: #000; display: none; flex-direction: column; }
        .plyr--full-ui { --plyr-color-main: #8b5cf6; border-radius: 0; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body class="pb-20">

    <!-- Hero Header -->
    <header class="relative h-[60vh] md:h-[80vh] w-full overflow-hidden mb-12">
        <div id="hero-bg" class="absolute inset-0 w-full h-full bg-cover bg-center scale-105" style="background-image: url('https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=2059');"></div>
        <div class="absolute inset-0 hero-vignette"></div>
        <nav class="absolute top-0 left-0 w-full p-8 flex justify-between items-center z-50">
            <a href="index.html" class="w-12 h-12 flex items-center justify-center rounded-full glass hover:bg-white/10 transition"><i class="fa-solid fa-arrow-left"></i></a>
            <h1 class="text-2xl font-black italic tracking-tighter">EXAR <span class="text-violet-500">ELITE</span></h1>
            <div class="w-2 h-2 rounded-full bg-violet-500 animate-pulse shadow-[0_0_10px_#8b5cf6]"></div>
        </nav>
        <div class="absolute bottom-16 left-8 md:left-20 max-w-2xl z-10 space-y-4">
            <h2 id="hero-title" class="text-5xl md:text-8xl font-black uppercase italic leading-none tracking-tighter">NEURAL<br>STREAM</h2>
            <p class="text-[10px] font-black uppercase tracking-[0.5em] text-white/30">Hugging Face Consumet API v3.0</p>
        </div>
    </header>

    <!-- Movies Grid -->
    <main class="max-w-7xl mx-auto px-6">
        <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6 md:gap-10"></div>
    </main>

    <!-- PLAYER SELECTOR (Bottom Sheet) -->
    <div id="selector-sheet" class="bottom-sheet" onclick="if(event.target==this) this.style.display='none'">
        <div class="sheet-content">
            <div class="w-14 h-1.5 bg-white/10 rounded-full mx-auto mb-10"></div>
            <h3 id="sel-title" class="text-2xl font-black uppercase italic mb-8">Movie Title</h3>
            
            <div class="grid gap-4">
                <!-- Consumet Option -->
                <button onclick="launchConsumet('internal')" class="node-btn">
                    <div class="w-14 h-14 bg-violet-600/20 rounded-2xl flex items-center justify-center text-violet-400 text-xl"><i class="fa-solid fa-bolt"></i></div>
                    <div class="text-left"><p class="text-base font-bold uppercase">Ultra Direct (No Ads)</p><p class="text-[10px] opacity-40 uppercase">Pure 4K Stream • Best Experience</p></div>
                </button>
                <!-- Hindi Node Option -->
                <button onclick="launchHindi()" class="node-btn">
                    <div class="w-14 h-14 bg-rose-600/20 rounded-2xl flex items-center justify-center text-rose-400 text-xl"><i class="fa-solid fa-language"></i></div>
                    <div class="text-left"><p class="text-base font-bold uppercase">Hindi Dubbed Node</p><p class="text-[10px] opacity-40 uppercase">External Source • Multi-Audio</p></div>
                </button>
                <!-- VLC Option -->
                <button onclick="launchConsumet('vlc')" class="node-btn">
                    <div class="w-14 h-14 bg-orange-600/20 rounded-2xl flex items-center justify-center text-orange-400 text-xl"><i class="fa-solid fa-cone-striped"></i></div>
                    <div class="text-left"><p class="text-base font-bold uppercase">External VLC Player</p><p class="text-[10px] opacity-40 uppercase">Instant Playback • No Buffering</p></div>
                </button>
            </div>
        </div>
    </div>

    <!-- PLAYER OVERLAY -->
    <div id="player-modal" class="player-modal">
        <div class="p-4 flex justify-between items-center bg-zinc-950 border-b border-white/5">
            <button onclick="closePlayer()" class="bg-white/5 px-6 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest text-zinc-400 active:scale-95 transition"><i class="fa-solid fa-xmark mr-1"></i> Exit</button>
            <h4 id="playing-title" class="text-[9px] font-bold uppercase opacity-30 tracking-widest truncate max-w-[50%]">Streaming</h4>
        </div>
        <div class="flex-1 relative flex items-center justify-center bg-black">
            <div id="p-loader" class="absolute inset-0 flex flex-col items-center justify-center gap-5 bg-black z-20">
                <div class="w-14 h-14 border-4 border-violet-500/10 border-t-violet-500 rounded-full animate-spin"></div>
                <p class="text-[10px] font-black uppercase text-violet-500 animate-pulse tracking-[0.3em]">Connecting Neural Hub...</p>
            </div>
            <div id="video-wrap" class="w-full h-full"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script>
        const config = { apiKey: "AIzaSyDI7v-5DoTUWZBhajcpZk6ed9rH2GcAqLw", databaseURL: "https://a2ztools-6ea22-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config); const db = firebase.database();
        
        let selectedImdb = "", selectedTitle = "", consumetApi = "";
        
        // Fetch Consumet URL from Firebase
        db.ref('settings/consumetUrl').on('value', s => consumetApi = s.val());

        // Load Movies
        db.ref('movies').on('value', s => {
            const grid = document.getElementById('movie-grid'); grid.innerHTML = '';
            let count = 0;
            s.forEach(c => {
                const m = c.val();
                if(count === 0) {
                    document.getElementById('hero-bg').style.backgroundImage = `url('${m.poster}')`;
                    document.getElementById('hero-title').innerText = m.title;
                }
                grid.innerHTML += `<div class="movie-card group" onclick="openSelector('${m.imdbId}', '${m.title}')">
                    <img src="${m.poster}" class="aspect-[2/3] object-cover shadow-2xl">
                    <h4 class="mt-4 text-[11px] font-bold uppercase truncate opacity-30">${m.title}</h4>
                </div>`;
                count++;
            });
        });

        function openSelector(id, title) {
            selectedImdb = id; selectedTitle = title;
            document.getElementById('sel-title').innerText = title;
            document.getElementById('selector-sheet').style.display = 'flex';
        }

        // --- CONSUMET LOGIC: THE BRAIN ---
        async function launchConsumet(type) {
            if(!consumetApi) return alert("Consumet API URL is missing!");
            const btn = event.currentTarget;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-3"></i> OPTIMIZING STREAM...`;

            try {
                // Fetch Movie Data
                const res = await fetch(`${consumetApi}/movies/flixhq/info?id=${selectedImdb}`);
                const data = await res.json();
                if(!data.episodes) throw new Error();

                // Fetch Stream Link
                const watchRes = await fetch(`${consumetApi}/movies/flixhq/watch?episodeId=${data.episodes[0].id}&mediaId=${selectedImdb}`);
                const watchData = await watchRes.json();
                const m3u8 = watchData.sources.find(s => s.quality === 'auto' || s.quality === '1080p').url;

                if(type === 'vlc') {
                    // Direct Android Intent for VLC (Pure Link)
                    const stripped = m3u8.replace('https://', '');
                    window.location.href = `intent://${stripped}#Intent;package=org.videolan.vlc;type=video/*;scheme=https;S.title=${selectedTitle};end`;
                } else {
                    playInInternal(m3u8);
                }
            } catch (e) {
                alert("Consumet Node Offline. Try Hindi Dubbed Node.");
            } finally {
                btn.innerHTML = originalHtml;
                document.getElementById('selector-sheet').style.display = 'none';
            }
        }

        function playInInternal(url) {
            const modal = document.getElementById('player-modal');
            const wrap = document.getElementById('video-wrap');
            modal.style.display = 'flex';
            document.getElementById('playing-title').innerText = selectedTitle;
            
            wrap.innerHTML = `<video id="main-player" playsinline controls class="w-full h-full"></video>`;
            const video = document.getElementById('main-player');

            // HLS Support logic
            if (Hls.isSupported()) {
                const hls = new Hls(); hls.loadSource(url); hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
            new Plyr(video);
            video.play();
            document.getElementById('p-loader').style.display = 'none';
        }

        function launchHindi() {
            document.getElementById('selector-sheet').style.display = 'none';
            const modal = document.getElementById('player-modal');
            const wrap = document.getElementById('video-wrap');
            modal.style.display = 'flex';
            document.getElementById('playing-title').innerText = `${selectedTitle} (Hindi Node)`;
            
            // Hindi specialized iFrame
            wrap.innerHTML = `<iframe src="https://vidsrc.cc/v2/embed/movie/${selectedImdb}?autoPlay=1" allowfullscreen referrerpolicy="no-referrer"></iframe>`;
            document.getElementById('p-loader').style.display = 'none';
        }

        function closePlayer() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('video-wrap').innerHTML = '';
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
