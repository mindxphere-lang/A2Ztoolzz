<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CINEMA — Pro Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: white; font-family: 'Outfit', sans-serif; }
        .movie-card { transition: 0.4s cubic-bezier(0.2, 1, 0.3, 1); cursor: pointer; }
        .movie-card:hover { transform: scale(1.05) translateY(-5px); }
        .player-modal { position: fixed; inset: 0; z-index: 2000; background: black; display: none; flex-direction: column; }
        .iframe-container { position: relative; width: 100%; height: 100%; background: #000; }
        iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
        .server-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 12px; font-size: 10px; font-weight: 900; text-transform: uppercase; }
        .server-btn.active { background: #e11d48; border-color: #e11d48; }
    </style>
</head>
<body class="p-6">

    <!-- Top Nav -->
    <nav class="flex justify-between items-center mb-12">
        <a href="index.html" class="w-12 h-12 flex items-center justify-center bg-white/5 rounded-2xl"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="text-2xl font-black uppercase italic tracking-tighter text-rose-600">EXAR CINEMA</h1>
        <div class="w-12 h-12 flex items-center justify-center bg-rose-600/10 rounded-2xl text-rose-500 animate-pulse"><i class="fa-solid fa-cloud-bolt"></i></div>
    </nav>

    <div id="movie-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
        <!-- Movies will load from Firebase here -->
    </div>

    <!-- PLAYER MODAL -->
    <div id="player-modal" class="player-modal">
        <div class="p-4 flex justify-between items-center bg-zinc-950 border-b border-white/5">
            <button onclick="closePlayer()" class="text-xs font-black uppercase tracking-widest text-zinc-500"><i class="fa-solid fa-xmark mr-2"></i> Close</button>
            <div id="server-list" class="flex gap-2">
                <!-- Server buttons will inject here -->
            </div>
        </div>

        <div class="iframe-container">
            <div id="p-loader" class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-black">
                <div class="w-10 h-10 border-2 border-rose-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-[9px] font-black uppercase tracking-widest opacity-30">Connecting to Global Nodes...</p>
            </div>
            <iframe id="main-iframe" allowfullscreen src="" referrerpolicy="no-referrer"></iframe>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script>
        const config = { apiKey: "AIzaSyDI7v-5DoTUWZBhajcpZk6ed9rH2GcAqLw", databaseURL: "https://a2ztools-6ea22-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config); const db = firebase.database();
        
        let currentImdbId = "";

        db.ref('movies').on('value', s => {
            const grid = document.getElementById('movie-grid'); grid.innerHTML = '';
            s.forEach(child => {
                const m = child.val();
                grid.innerHTML += `
                    <div class="movie-card group" onclick="initPlayer('${m.imdbId}')">
                        <div class="aspect-[2/3] rounded-[2rem] overflow-hidden border border-white/5 shadow-2xl">
                            <img src="${m.poster}" class="w-full h-full object-cover">
                        </div>
                        <h4 class="mt-4 text-[11px] font-black uppercase truncate px-2 opacity-70">${m.title}</h4>
                    </div>`;
            });
        });

        // Professional Streaming Sources (Same as top free sites)
        const sources = [
            { name: "Server 1", url: (id) => `https://vidsrc.me/embed/movie?imdb=${id}` },
            { name: "Server 2", url: (id) => `https://vidsrc.to/embed/movie/${id}` },
            { name: "Server 3", url: (id) => `https://embed.su/embed/movie/${id}` }
        ];

        function initPlayer(imdbId) {
            currentImdbId = imdbId;
            const modal = document.getElementById('player-modal');
            const serverList = document.getElementById('server-list');
            
            // Build Server Switcher
            serverList.innerHTML = '';
            sources.forEach((src, index) => {
                serverList.innerHTML += `<button onclick="switchServer(${index})" class="server-btn ${index===0?'active':''}">${src.name}</button>`;
            });

            switchServer(0); // Load Server 1 by default
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function switchServer(index) {
            // Update UI
            document.querySelectorAll('.server-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            
            // Update Iframe
            const iframe = document.getElementById('main-iframe');
            iframe.src = sources[index].url(currentImdbId);
        }

        function closePlayer() {
            const modal = document.getElementById('player-modal');
            document.getElementById('main-iframe').src = '';
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
