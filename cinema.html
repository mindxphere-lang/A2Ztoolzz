<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CINEMA — Pure Intelligence Node</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #e11d48; --bg: #000; }
        body { background: #050505; color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        
        .movie-card { transition: 0.4s ease; cursor: pointer; position: relative; }
        .movie-card:active { transform: scale(0.95); }
        .movie-card img { border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.05); aspect-ratio: 2/3; object-fit: cover; }
        
        .player-modal { position: fixed; inset: 0; z-index: 9999; background: black; display: none; flex-direction: column; }
        
        /* Server & VLC Buttons */
        .s-btn { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            padding: 10px 18px; border-radius: 12px; font-size: 10px; font-weight: 800; 
            text-transform: uppercase; white-space: nowrap; color: #888; transition: 0.3s;
        }
        .s-btn.active { background: #e11d48; border-color: #fb7185; color: white; box-shadow: 0 0 15px rgba(225, 29, 72, 0.4); }
        
        .vlc-btn { background: linear-gradient(135deg, #f97316, #ea580c); box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }

        .iframe-container { position: relative; width: 100%; height: 100%; background: #000; flex: 1; }
        iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; z-index: 10; }
        
        .status-bar { background: #0a0a0a; padding: 10px; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .tip-txt { font-size: 9px; font-weight: 900; color: #fb7185; text-transform: uppercase; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Nav -->
    <nav class="flex justify-between items-center mb-8 max-w-7xl mx-auto">
        <a href="index.html" class="w-10 h-10 flex items-center justify-center bg-white/5 rounded-xl border border-white/10 transition active:scale-90"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="text-xl font-black uppercase italic tracking-tighter text-rose-600">EXAR CINEMA</h1>
        <div class="w-2 h-2 rounded-full bg-rose-600 animate-pulse"></div>
    </nav>

    <div id="movie-grid" class="max-w-7xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5"></div>

    <!-- PLAYER OVERLAY -->
    <div id="player-modal" class="player-modal">
        <!-- Control Bar -->
        <div class="p-3 flex justify-between items-center bg-zinc-950 border-b border-white/5">
            <button onclick="closePlayer()" class="bg-white/5 px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest text-zinc-400"><i class="fa-solid fa-xmark mr-1"></i> Exit</button>
            
            <!-- VLC BUTTON (The Ad-Free Solution) -->
            <button onclick="launchVLC()" class="vlc-btn px-6 py-2.5 rounded-xl text-[10px] font-black uppercase text-white animate-pulse">
                <i class="fa-solid fa-orange-cone mr-1"></i> VLC Player (No Ads)
            </button>
        </div>

        <!-- Scrollable Server List -->
        <div class="p-3 flex gap-2 overflow-x-auto no-scrollbar bg-black/50" id="server-list"></div>

        <div class="iframe-container">
            <div id="p-loader" class="absolute inset-0 flex flex-col items-center justify-center gap-4 bg-black z-20">
                <div class="w-10 h-10 border-2 border-rose-600/20 border-t-rose-600 rounded-full animate-spin"></div>
                <p class="text-[9px] font-black uppercase text-rose-500">Syncing Hindi Node...</p>
            </div>
            
            <!-- ADVANCED SANDBOX IFRAME (Blocks Redirect Ads) -->
            <iframe id="cinema-frame" 
                    sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation" 
                    src="" 
                    allowfullscreen></iframe>
        </div>

        <div class="status-bar">
            <p class="tip-txt" id="audio-tip"><i class="fa-solid fa-headphones mr-1"></i> HINDI AUDIO DETECTED • CLICK GEAR ⚙️ TO SWITCH</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script>
        const config = { apiKey: "AIzaSyDI7v-5DoTUWZBhajcpZk6ed9rH2GcAqLw", databaseURL: "https://a2ztools-6ea22-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config); const db = firebase.database();
        
        let currentImdbId = "", currentTitle = "";

        // --- NEW WORKING HINDI SERVERS ---
        const sources = [
            { name: "Node 1 (Hindi/Dual)", url: (id) => `https://moviesapi.club/movie/${id}` },
            { name: "Node 2 (Hindi Dub)", url: (id) => `https://vidsrc.icu/embed/movie/${id}` },
            { name: "Node 3 (Multi-Audio)", url: (id) => `https://vidsrc.cc/v2/embed/movie/${id}?autoPlay=1` }
        ];

        db.ref('movies').on('value', s => {
            const grid = document.getElementById('movie-grid'); grid.innerHTML = '';
            s.forEach(child => {
                const m = child.val();
                grid.innerHTML += `<div class="movie-card group" onclick="openPlayer('${m.imdbId}', '${m.title}')">
                    <img src="${m.poster}" class="w-full shadow-2xl">
                    <h4 class="mt-3 text-[10px] font-bold uppercase truncate px-1 opacity-50 text-center">${m.title}</h4>
                </div>`;
            });
        });

        function openPlayer(imdbId, title) {
            currentImdbId = imdbId; currentTitle = title;
            const list = document.getElementById('server-list');
            list.innerHTML = sources.map((src, i) => `<button onclick="switchServer(${i})" class="s-btn s-btn-${i} ${i===0?'active':''}">${src.name}</button>`).join('');
            switchServer(0); 
            document.getElementById('player-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function switchServer(index) {
            document.querySelectorAll('.s-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll(`.s-btn-${index}`).forEach(btn => btn.classList.add('active'));
            const iframe = document.getElementById('cinema-frame');
            document.getElementById('p-loader').style.display = 'flex';
            iframe.src = sources[index].url(currentImdbId);
            iframe.onload = () => { setTimeout(() => { document.getElementById('p-loader').style.display = 'none'; }, 2000); };
        }

        // --- THE VLC PRO BYPASS ---
        function launchVLC() {
            // VLC logic using current active stream
            const currentUrl = document.getElementById('cinema-frame').src;
            const stripped = currentUrl.replace('https://','');
            const userAgent = navigator.userAgent;

            if (/android/i.test(userAgent)) {
                window.location.href = `intent://${stripped}#Intent;package=org.videolan.vlc;type=video/*;scheme=https;S.title=${currentTitle};end`;
            } else if (/iPad|iPhone|iPod/.test(userAgent)) {
                window.location.href = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(currentUrl)}`;
            } else {
                window.location.href = `vlc://${currentUrl}`;
            }
        }

        function closePlayer() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('cinema-frame').src = '';
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
